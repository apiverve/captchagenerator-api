name: apiverve_captchagenerator
description: "Captcha Generator creates a new captcha on every call: distorted characters or a simple math question as a GIF or PNG, with the answer to check on your server. Add audio=true for a spoken version, the accessible alternative for visitors who can't see the image."
version: 1.2.6
homepage: https://apiverve.com/marketplace/captchagenerator?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/captchagenerator-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
